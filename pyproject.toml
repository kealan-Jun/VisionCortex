[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "labvision-evidence"
version = "0.1.0"
description = "Multi-view chemistry wet-lab video evidence pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "numpy>=1.26,<2",
  "nvidia-ml-py>=12.560",
  "opencv-python>=4.10",
  "openpyxl>=3.1",
  "psutil>=6.0",
  "pydantic>=2.8",
  "PyYAML>=6.0",
  "python-multipart>=0.0.9",
  "reportlab>=4.2",
  "tzdata>=2024.1",
  "typer>=0.12",
  "ultralytics>=8.4.0",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
tensorrt = ["tensorrt-cu12>=10.0"]

[project.scripts]
labvision = "labvision_evidence.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
labvision_evidence = ["web/*.html", "web/*.css", "web/*.js", "templates/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
