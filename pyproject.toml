[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "labvision-evidence"
version = "0.1.0"
description = "Multi-view chemistry wet-lab video evidence pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "numpy>=1.26,<2",
  "nvidia-ml-py>=12.560,<14",
  "opencv-python>=4.10,<5",
  "openpyxl>=3.1,<4",
  "psutil>=6.0,<8",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "python-multipart>=0.0.9,<1",
  "reportlab>=4.2,<6",
  "tzdata>=2024.1",
  "typer>=0.12,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2,<3",
  "pytest>=8.0,<10",
  "pytest-cov>=5.0,<8",
]
models = [
  "transformers==4.57.6",
  "ultralytics>=8.4.0,<9",
  "clip @ git+https://github.com/ultralytics/CLIP.git@68dce32140994dfcb645a1320c4ebdc034fc19fd",
]
tensorrt = ["tensorrt-cu12>=10.0,<11"]
sam2 = ["SAM-2 @ git+https://github.com/facebookresearch/sam2.git@2b90b9f5ceec907a1c18123530e92e794ad901a4"]

[project.scripts]
labvision = "labvision_evidence.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
labvision_evidence = ["web/*.html", "web/*.css", "web/*.js", "templates/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-config --strict-markers"
filterwarnings = [
  "error",
  "ignore:The anyio\\.abc\\.BlockingPortal alias is deprecated, use anyio\\.from_thread\\.BlockingPortal instead\\.:DeprecationWarning",
]

[tool.ruff.lint]
# Keep the default E4/E7/E9/F rules and add the small set of bug-risk rules
# that this codebase enforces without flagging intentional Chinese prose.
extend-select = ["B006", "B007", "B904", "B905"]
