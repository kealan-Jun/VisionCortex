<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>实验视频 · @@Title@@</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eaf2f3;color:#112d32;font:16px system-ui,sans-serif}main{max-width:1400px;margin:auto;padding:20px}header{display:flex;align-items:center;gap:14px;margin-bottom:18px}header img{width:46px;height:46px}h1{font-size:23px;margin:0}a{color:#2d7c82}header a{margin-left:auto}.identity{overflow-wrap:anywhere;color:#526d73;margin:12px 0}.screen{position:relative;background:#112d32;min-height:220px;display:grid;place-items:center;border-radius:10px;overflow:hidden}.screen canvas{display:block;width:100%;max-height:max(200px,calc(100dvh - 255px));object-fit:contain}.screen video{position:absolute;width:1px;height:1px;opacity:.01;pointer-events:none}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:white;border:1px solid #cbdadc;border-radius:10px;padding:14px;margin-top:12px}button,select{font:inherit;padding:10px 16px;border:1px solid #cbdadc;border-radius:7px;background:white;color:#1e4a52;cursor:pointer}button.primary{background:#1e4a52;color:white}button:disabled{opacity:.5}input[type=range]{flex:1;min-width:160px;accent-color:#2d7c82}output{font-variant-numeric:tabular-nums}#Status{min-height:24px}#Status.error{color:#ad4332}small{color:#526d73}@media(max-width:600px){main{padding:12px}header{flex-wrap:wrap}h1{font-size:18px}.controls{gap:8px}input[type=range]{order:5;flex-basis:100%}}
</style></head><body><main>
<header><img src="@@Logo@@" alt="VisionCortex"><h1>实验视频</h1><a href="@@Overview@@" target="_top">返回实验数据总览</a></header>
<details class="identity"><summary>@@Title@@</summary>@@Path@@</details>
<div class="screen" id="Screen"><canvas id="Picture" width="1280" height="800" aria-label="视频画面"></canvas><video id="Media" src="@@Source@@" preload="auto" playsinline crossorigin="anonymous" aria-hidden="true" tabindex="-1"></video></div>
<div class="controls"><button class="primary" id="Play">播放</button><button id="Retry" hidden>重新载入</button><input id="Seek" type="range" min="0" max="0" step="0.1" value="0" aria-label="播放进度" disabled><output id="Time">00:00 / --:--</output><label>倍速 <select id="Speed" aria-label="播放倍速"><option>0.5</option><option selected>1</option><option>1.5</option><option>2</option></select></label><button id="Sound">静音</button><button id="Fullscreen">全屏</button></div>
<p id="Status" role="status">正在载入视频首帧…</p><small>直接读取归档视频，时长和画面保持原样。此页面只负责播放，实验结论请查看对应记录。</small>
</main><script>@@Script@@</script></body></html>
