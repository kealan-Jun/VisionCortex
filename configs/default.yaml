runtime:
  role: combined
  # Resource limits are deployment-specific, never a fixed camera count.
  resource_limits: {}
  admission_timeout_seconds: 300
  local_only: false
  provider_circuit_enabled: false

capture_quality:
  enabled: true
  sample_windows: 4
  sample_seconds: 3

speech_recognition:
  enabled: false
  python_executable: null
  model_directory: null
  model_registry: configs/models/speech-recognition.json
  language: zh
  cpu_threads: 4
  # Budget per recorder segment; multi-segment work is queued separately.
  max_audio_seconds: 1800
  max_source_bytes: 134217728
  context_max_segments: 80
  context_max_characters: 8000

device_day:
  schema_version: visioncortex-device-day/1
  enabled: false
  chunk_seconds: 900
  timezone: Asia/Shanghai
  start_date: '2026-09-10'
  vision_workers: 2
  stt_workers: 1
  understanding_workers: 2
  inactive_frames: 8
  active_frames_per_window: 12
  active_window_seconds: 30
  # User instruction: implement cleanup, but DO NOT enable or execute it.
  delete_capture_sources: false

project:
  output_root: ./outputs
  experiment_id_prefix: CHEM
  # Development-only acceptance mode stops after bounded dual-view CV audit.
  # The production pipeline and Web submissions always leave this disabled.
  preprocessing_acceptance_only: false

models:
  first_person: D:/LabModels/yolo/first_person/yolo26s_first_21_v1/best.pt
  third_person: D:/LabModels/yolo/third_person/yolo26s_third_21_v1/best.pt
  first_person_engine: D:/LabModels/yolo/first_person/yolo26s_first_21_v1/best.engine
  third_person_engine: D:/LabModels/yolo/third_person/yolo26s_third_21_v1/best.engine
  expected_class_count: 21
  confidence: 0.25
  iou: 0.55
  max_detections: 300

# Optional specialist for liquid visibility, meniscus, fill ratio and flow.
# The foundation is intentionally disabled and is not connected to preprocessing;
# enabling it also requires a separately registered deployment adapter.
liquid_state:
  enabled: false
  backend: disabled
  model_path: null
  device: 0
  half: true
  sample_fps: 2.0
  burst_fps: 10.0
  confidence_threshold: 0.65
  container_roi_padding_fraction: 0.10
  max_runtime_seconds: 200.0

performance:
  preprocessing_budget_seconds: 1200
  device: 0
  half: true
  tensor_rt: auto
  batch_size: 16
  coarse_batch_size: 16
  coarse_first_person_views: 1
  coarse_third_person_views: 1
  coarse_refinement_association_margin_seconds: 30.0
  coarse_refinement_min_candidates: 2
  coarse_refinement_min_span_seconds: 30.0
  coarse_quarantine_objectless_unconfirmed_motion: true
  coarse_shared_motion_probe_enabled: false
  coarse_frame_index_enabled: false
  coarse_coverage_gate_enabled: false
  coarse_minimum_coverage_ratio: 0.98
  coarse_maximum_gap_periods: 4.0
  candidate_discovery_quality_gate_enabled: false
  coarse_semantic_association_enabled: false
  coarse_semantic_cluster_margin_seconds: 3.0
  coarse_max_boundary_expansion_seconds: 0.0
  coarse_spatial_relation_enabled: false
  coarse_hand_object_gap_norm: 0.08
  coarse_hand_object_approach_gap_norm: 0.16
  coarse_hand_object_approach_delta_norm: 0.025
  coarse_micro_action_guard_enabled: false
  coarse_micro_action_min_confidence: 0.72
  coarse_micro_action_window_seconds: 4.0
  coarse_rolling_motion_threshold_enabled: false
  coarse_rolling_motion_window_seconds: 600.0
  coarse_tracker_motion_prediction_enabled: false
  coarse_tracker_maximum_center_distance: 0.18
  coarse_open_vocabulary_recall_enabled: false
  coarse_open_vocabulary_adaptive_selection_enabled: false
  coarse_open_vocabulary_diversity_bucket_seconds: 600.0
  coarse_open_vocabulary_max_frames_per_hour_per_view: 2
  coarse_open_vocabulary_maximum_error_rate: 0.10
  fine_batch_size: 16
  # A lone first-person source otherwise starves TensorRT between FFmpeg
  # bursts. Decode two adjacent bounded chunks concurrently, but consume them
  # in timestamp order so tracking and boundary semantics remain unchanged.
  fine_chunk_seconds: 120
  fine_active_decode_slots: 6
  fine_first_person_decode_workers: 2
  fine_third_person_decode_workers: 2
  fine_decode_prefetch_frames: 12
  fine_persistent_segment_decode: false
  # Optional seek/decode tradeoff. Null preserves one session per physical
  # recorder segment; hardware profiles may split distant target windows.
  fine_persistent_session_max_gap_seconds: null
  fine_group_local_recall_enabled: false
  fine_group_recall_min_unresolved_anchors: 3
  fine_group_recall_padding_seconds: 0.0
  fine_group_recall_max_rounds: 5
  fine_group_recall_cluster_gap_seconds: 10.0
  # A zero-yield coarse prior is not proof that a static view cannot close a
  # later dual-view gap. Exhaust remaining views for unresolved temporal
  # clusters before declaring the evidence layer complete.
  fine_group_recall_zero_prior_quality_fallback: true
  # Optional derived index for the existing fine stage. JSONL remains the
  # authoritative evidence ledger; hardware profiles may enable incremental
  # indexing, coverage admission and bounded-memory candidate reduction.
  fine_frame_index_enabled: false
  fine_coverage_gate_enabled: false
  fine_minimum_coverage_ratio: 0.98
  fine_maximum_gap_periods: 4.0
  fine_streaming_candidates_enabled: false
  fine_state_max_entries: 4096
  fine_instance_association_enabled: false
  fine_instance_appearance_enabled: false
  fine_instance_minimum_cosine_similarity: 0.25
  fine_instance_cross_view_conflict_quarantine_enabled: false
  fine_track_stitching_enabled: false
  fine_track_stitch_max_gap_seconds: 2.5
  fine_track_stitch_max_center_distance: 0.12
  fine_contact_state_enabled: false
  fine_affine_object_motion_enabled: false
  fine_roi_open_vocabulary_recall_enabled: false
  fine_roi_open_vocabulary_max_frames_per_window: 2
  fine_roi_open_vocabulary_hand_padding_norm: 0.20
  fine_roi_open_vocabulary_maximum_error_rate: 0.10
  # Null inherits the established coarse tracker setting for compatibility.
  fine_tracker_motion_prediction_enabled: null
  fine_tracker_maximum_center_distance: null
  # In-place candidate_audit upgrades. The default profile retains the
  # established decisions; production hardware profiles enable the stricter
  # association, formal-admission and bounded-query contracts explicitly.
  audit_constrained_clustering_enabled: false
  audit_local_alignment_enabled: false
  audit_explainable_scoring_enabled: false
  audit_formal_admission_status_enabled: false
  audit_core_interval_enabled: false
  audit_stable_event_ids_enabled: false
  audit_sqlite_candidate_index_enabled: false
  audit_max_cluster_span_seconds: 30.0
  audit_core_start_quantile: 0.50
  audit_core_end_quantile: 0.50
  audit_independent_view_bonus: 0.04
  audit_dual_role_bonus: 0.04
  audit_maximum_independence_bonus: 0.12
  audit_maximum_alignment_penalty: 0.08
  audit_liquid_spatial_context_enabled: false
  audit_liquid_context_hand_object_gap_norm: 0.08
  audit_liquid_context_minimum_frames: 2
  audit_liquid_sequence_formal_gate_enabled: false
  action_state_observed_timestamps_enabled: false
  # Optional workload-adaptive mode. The default remains the established all-
  # selected-view scan; hardware profiles may enable progressive cross-view
  # supplementation explicitly.
  fine_progressive_cross_view: false
  fine_initial_third_person_views: 1
  fine_supplemental_view_batch_size: 1
  # Optional user/deployment hint only; keep empty for automatic upload-driven ranking.
  fine_preferred_third_person_views: []
  # Associate evidence with its recalled boundary, not the much wider decode padding.
  fine_progressive_audit_margin_seconds: 5.0
  fine_progressive_anchor_cluster_gap_seconds: 10.0
  # Hardware profiles may scout all third-person views around precise first-
  # person anchors before the full-FPS fallback order is chosen.
  fine_dynamic_cross_view_scout: false
  fine_scout_fps: 1.0
  fine_scout_image_size: 416
  fine_scout_batch_size: 8
  fine_scout_keyframes_only: false
  # Scout around the most informative instant instead of decoding the full
  # action span. Formal 10 FPS evidence still uses the full aligned span.
  fine_scout_anchor_radius_seconds: 3.0
  fine_scout_peak_dedup_tolerance_seconds: 0.25
  fine_scout_peak_cluster_gap_seconds: 60.0
  fine_scout_representatives_per_cluster: 1
  fine_progressive_anchor_padding_seconds: 10.0
  image_size: 960
  coarse_detection_fps: 0.125
  coarse_image_size: 512
  coarse_keyframes_only: true
  detection_fps: 8.0
  fine_window_padding_seconds: 75.0
  # Candidate windows already receive padding on both sides. Only merge the
  # padded intervals when they overlap; reusing the padding as a second merge
  # gap silently scans idle time between otherwise independent experiments.
  fine_window_merge_gap_seconds: 0.0
  motion_burst_percentile: 90.0
  motion_burst_merge_gap_seconds: 16.0
  motion_burst_min_observations: 2
  max_gpu_memory_fraction: 0.92
  ffmpeg_hwaccel: cuda
  ffmpeg_cuda_scale: false
  ffmpeg_video_encoder: h264_nvenc
  workers: 2
  decode_workers: 6
  concurrent_role_scanners: true
  chunk_seconds: 600
  checkpoint_every_chunks: 1
  frame_queue_size: 64
  decode_queue_depth: 64
  # Motion discovery is deliberately separate from YOLO. One first-person
  # and one third-person sentinel discover multi-minute activity windows.
  motion_probe_fps: 0.5
  motion_probe_max_width: 96
  motion_probe_keyframes_only: true
  motion_probe_sparse_strategy: indexed_seek
  motion_probe_run_yolo: false
  coarse_reuse_motion_probe: false
  motion_probe_first_person_views: 1
  motion_probe_third_person_views: 1
  motion_probe_percentile: 85.0
  motion_probe_burst_merge_gap_seconds: 20.0
  motion_probe_min_observations: 2
  motion_probe_merge_gap_seconds: 20.0
  motion_probe_min_views: 2
  motion_probe_primary_min_seconds: 45.0
  motion_probe_window_padding_seconds: 90.0
  motion_probe_affine_compensation_enabled: false
  motion_probe_max_rotation_degrees: 8.0
  motion_probe_max_scale_delta: 0.12
  motion_probe_rolling_threshold_enabled: false
  motion_probe_rolling_window_seconds: 600.0
  motion_probe_legacy_raw_union_enabled: false
  motion_probe_max_cluster_seconds: 0.0
  motion_probe_fallback_peaks_per_hour: 8
  motion_probe_fallback_separation_seconds: 120.0
  motion_probe_fallback_window_seconds: 60.0
  motion_probe_segment_workers: 1
  motion_probe_sparse_benchmark_seconds: 60.0
  motion_probe_indexed_segment_workers: 3
  motion_probe_sequential_segment_workers: 1
  motion_signature_size: [64, 36]
  coarse_decode_lanes: [cuda, cuda, cuda, cuda, cuda, cuda]
  fine_decode_lanes: [cuda, cuda, cuda, cuda, cuda, cuda]
  cpu_decode_threads: 8
  source_workers: 6
  yolo_inference_workers: 2
  inference_batch_wait_ms: 25
  materialization_workers: 2
  # Experiment clips are already local, verified derivatives with original
  # NAS provenance. Reuse them for key frames/clips so every event does not
  # reopen and randomly seek the frozen remote source.
  reuse_experiment_clips_for_key_materials: true
  io_workers: 4
  synchronized_segment_waves: false
  segment_wave_timeout_seconds: 3600
  preflight_probe_workers: 12
  preflight_prefer_clock_metadata: true
  # Exercise the real source decode, selected encoder and aligned grid path
  # before long scans or paid model calls. The temporary clips stay local and
  # are removed after a successful probe.
  media_pipeline_preflight_enabled: true
  media_pipeline_preflight_seconds: 1.0
  source_stat_workers: 24
  source_stat_cache_ttl_seconds: 120

alignment:
  reference_view: first_person
  # Keep the configured first-person preference when clock quality ties, but
  # do not let a recorder with invalid or discontinuous clocks anchor every
  # other view.
  reference_strategy: best_clock_quality
  reference_preference_bonus: 0.15
  nearest_tolerance_ms: 120.0
  visual_anchor_search_seconds: 5.0
  visual_anchor_fps: 4.0
  max_drift_ppm: 2500.0
  minimum_match_ratio: 0.60
  cross_view_event_tolerance_ms: 750.0
  cross_view_event_max_tolerance_ms: 2500.0
  visual_anchor_count: 3
  visual_anchor_duration_seconds: 10.0
  visual_audit_csv_confidence_threshold: 0.80
  visual_audit_search_seconds: 1.0
  visual_audit_anchor_count: 3
  visual_audit_duration_seconds: 2.0
  visual_audit_fps: 2.0
  mandatory_visual_audit: true
  aligned_timestamps_fps: 2.0
  max_csv_points_per_view: 30000
  # Read a few distributed rows from every physical clock ledger. This remains
  # bounded over SMB while detecting mid-segment resets that endpoints miss.
  csv_sampling_mode: bounded_sparse
  csv_samples_per_segment: 5
  csv_bounded_full_read_limit_bytes: 2097152
  csv_read_workers: 12
  clock_jump_threshold_ms: 500.0
  clock_rate_error_ppm: 10000.0
  maximum_segment_clock_shift_ms: 300000.0
  minimum_alignment_uncertainty_ms: 25.0
  maximum_alignment_uncertainty_ms: 5000.0
  local_timeline_fallback_enabled: true
  local_timeline_confidence_cap: 0.65
  local_timeline_uncertainty_ms: 1000.0
  # Preserve timestamp-less local workflows, but label them degraded. Formal
  # server profiles may override this to require absolute or visual evidence.
  allow_local_timeline_formal_evidence: true
  allow_uncertain_segment_formal_evidence: true
  quality_gate_enabled: true
  minimum_required_role_overlap_ms: 1000.0
  view_coverage_warning_ratio: 0.999
  # Retained for older profile readers. csv_sampling_mode is authoritative.
  csv_segment_endpoints_only: true

segmentation:
  min_experiment_seconds: 5.0
  experiment_gap_seconds: 30.0
  # Preserve the existing 30 s fallback while allowing longer observable
  # process actions to survive ordinary reading/tool-change pauses.
  experiment_gap_seconds_by_action:
    liquid_movement: 45.0
    pipette_transfer_operation: 45.0
    device_panel_operation: 60.0
  # A larger gap is bridged only inside one recalled window and only when at
  # least two view-scoped tracked object identities survive on both sides.
  identity_idle_bridge_enabled: true
  identity_idle_bridge_max_gap_seconds: 300.0
  identity_idle_bridge_min_shared_identities: 2
  experiment_pre_roll_seconds: 2.0
  experiment_post_roll_seconds: 3.0
  boundary_context_activation_gap_seconds: 30.0
  boundary_context_bridge_confidence: 0.50
  boundary_context_min_confidence: 0.65
  boundary_context_max_gap_seconds: 10.0
  boundary_context_max_extension_seconds: 90.0
  # Rejected single-role CV events cannot become formal/key-material evidence,
  # but a dense chain inside one object-verified motion envelope may bound the
  # preparation/cleanup surrounding a dual-view core.  Boundary-only use is
  # recorded by decision receipts and never changes event membership.
  rejected_boundary_context_enabled: true
  # Broad multi-workflow collections remain fail-closed: single-role context
  # cannot safely decide which neighboring workflow owns it without semantics.
  rejected_boundary_context_max_formal_segments: 3
  rejected_boundary_context_min_confidence: 0.30
  rejected_boundary_context_strong_confidence: 0.65
  rejected_boundary_context_max_gap_seconds: 10.0
  rejected_boundary_context_max_extension_seconds: 180.0
  rejected_boundary_context_weak_fringe_seconds: 10.5
  rejected_boundary_context_evidence_overflow_seconds: 15.0
  recalled_boundary_start_snap_seconds: 60.0
  recalled_boundary_start_bridge_gap_seconds: 30.0
  # If a verified recall boundary extends ahead of the conservative formal
  # opener, restore only already-accepted events that raw segmentation clipped
  # entirely. Evidence quarantined in its own raw segment remains excluded.
  recalled_boundary_membership_recovery_enabled: true
  recalled_boundary_membership_max_step_gap_seconds: 30.0
  recalled_boundary_membership_single_role_min_confidence: 0.78
  recalled_boundary_membership_action_types:
    - hand_object_contact
    - object_movement
    - container_state_change
    - device_panel_operation
  # A strong single-role tail may extend clip time only when it shares the same
  # recalled boundary and at least two manipulated objects with the preceding
  # dual-view segment. Its events stay outside formal/key-material membership.
  boundary_tail_context_max_gap_seconds: 30.0
  boundary_tail_context_min_shared_objects: 2
  # A liquid-motion hypothesis may remain useful evidence, but only a complete
  # transfer tool is strong enough to establish the start of an experiment.
  # This prevents isolated pipette-tip/vessel motion from pulling the boundary
  # earlier than the first directly observed physical interaction.
  liquid_start_anchor_required_objects: [pipette]
  movement_opener_corroboration_seconds: 30.0
  key_clip_pre_seconds: 2.0
  key_clip_post_seconds: 3.0
  event_merge_gap_seconds: 1.25
  min_event_duration_seconds: 0.50
  min_event_observations: 3
  min_view_action_density_per_minute: 0.30
  # Long experiments may contain valid sparse observations separated by a
  # wait. Preserve such a view only when it has multiple accepted events and
  # at least one second of direct evidence; this does not weaken dual-role
  # formal delivery.
  long_experiment_sparse_view_enabled: true
  long_experiment_sparse_view_min_duration_seconds: 120.0
  long_experiment_sparse_view_min_events: 2
  long_experiment_sparse_view_min_evidence_seconds: 1.0
  single_view_accept_confidence: 0.78
  # Container open/close is a directly observable state transition. It still
  # requires aligned media and MLLM confirmation before semantic acceptance.
  single_view_action_accept_confidence:
    container_state_change: 0.70
  # A short state transition can be clear in one view while the paired view
  # emits only a lower-level movement label. Admit the hypothesis to mandatory
  # semantic review when an aligned opposite-role candidate overlaps in time;
  # this does not itself confirm the action or claim cross-view support.
  semantic_review_cross_role_context_enabled: true
  semantic_review_cross_role_context_min_confidence:
    liquid_movement: 0.50
    # The cap/open cue is deliberately only an admission threshold. A 0.38+
    # single-view hypothesis still needs aligned opposite-role activity and
    # the strict structured before/after semantic proof before publication.
    container_state_change: 0.38
    device_panel_operation: 0.45
  semantic_review_cross_role_context_support_min_confidence: 0.55
  movement_threshold_norm: 0.025
  # Integrate motion across time instead of requiring a large per-frame jump.
  movement_window_ms: 250
  movement_window_threshold_norm: 0.01
  movement_visual_verification:
    enabled: true
    max_pairs_per_candidate: 3
    max_candidates: 2048
    max_wall_seconds: 600
  # Wearable camera motion shifts every box together. Subtract the median
  # translation of at least two stable lab anchors before declaring movement.
  camera_motion_compensation_min_anchors: 2
  # A balance or stirrer box moving because of camera jitter is not an
  # experiment-opening physical action.
  suppress_stationary_device_movement: true
  contact_distance_norm: 0.035
  liquid_motion_threshold: 6.0
  liquid_transfer_max_sequence_gap_seconds: 20.0
  liquid_transfer_min_contact_observations: 2
  # Duplicate boxes and simultaneous tool/vessel matches are not a transfer.
  # Both exclusive contact runs must persist; intervening motion is unconfirmed.
  liquid_transfer_min_contact_duration_seconds: 0.20
  require_both_roles: true
  # A physical action can be visually conclusive in only one role because of
  # occlusion. Delivery still requires aligned first/third-person media; this
  # switch only separates action acceptance from media-pair completeness.
  allow_strong_single_role_actions: true

action_state_machine:
  enabled: true
  # Shadow mode preserves the frozen CV boundary/recall baseline. The receipt
  # exposes incomplete or component-only actions without silently deleting
  # candidates. A later dataset-specific acceptance task may enable a hard gate.
  enforce_publish_gate: false
  minimum_phase_completeness: 0.75
  occlusion_grace_seconds: 1.50
  release_hold_seconds: 0.30
  fragment_identity_gap_seconds: 1.50

continuity:
  # Temporal proximity alone is insufficient. Two carried container/sample
  # identities must bridge adjacent atomic experiments; a lone generic object
  # movement is too weak to merge otherwise independent experiments.
  max_gap_seconds: 300.0
  require_shared_third_view: false
  minimum_shared_objects: 2
  minimum_shared_object_identities: 1
  preparation_bridge_max_gap_seconds: 20.0
  preparation_segment_max_seconds: 20.0
  preparation_segment_max_events: 2
  preparation_following_min_seconds: 30.0
  # Adjacent motion envelopes can split one atomic operation around a short
  # pause. Merge only when dual-view evidence and at least two carried physical
  # objects agree, and neither side contains an explicit state/equipment step.
  atomic_fragment_merge_max_gap_seconds: 20.0
  atomic_fragment_min_shared_objects: 2
  atomic_fragment_min_shared_object_identities: 1
  # A motion-envelope fragment is deliberately small. Rich sequences are
  # preserved as separate atomic experiments only when both sides repeat a
  # core process action; a following handling/cleanup envelope remains part of
  # the original atomic experiment.
  atomic_fragment_max_events_per_side: 3
  atomic_fragment_repeated_primary_actions:
    - liquid_movement
    - pipette_transfer_operation
    - container_state_change
    - device_panel_operation
  # One wide coarse motion envelope may cover two complete adjacent workflows.
  # Split only at a real inactivity gap when each side remains a rich dual-view
  # sequence and both sides repeat a primary process action. This is stricter
  # than the ordinary event-gap rule and does not split handling/cleanup tails.
  # An 8.6-second pause occurs inside one independently reviewed repeated
  # pipetting workflow in the six-view collection. Require a clearer
  # inactivity boundary; the independently reviewed Z0001 atomic split remains
  # 9.9 seconds and therefore still exceeds this threshold.
  atomic_sequence_split_min_gap_seconds: 9.0
  atomic_sequence_split_min_gap_seconds_by_action:
    liquid_movement: 9.0
    pipette_transfer_operation: 9.0
    container_state_change: 6.0
    device_panel_operation: 12.0
  atomic_sequence_split_min_events_per_side: 4
  # A brief FP-only observation may sit between two corroborated fragments of
  # one recalled operation when the TP view is occluded. It may connect the
  # audit graph, but its events must never enter the formal segment.
  quarantined_atomic_bridge_max_step_gap_seconds: 60.0
  quarantined_atomic_bridge_max_span_seconds: 180.0
  quarantined_context_bridge_min_events: 2
  quarantined_context_bridge_min_shared_objects: 2
  # A motion probe can split one long workflow into adjacent coarse windows.
  # Permit continuity without a shared coarse-window id only when a dense,
  # object-consistent rejected FP chain independently proves the bridge.
  quarantined_cross_boundary_bridge_enabled: true
  quarantined_cross_boundary_bridge_max_span_seconds: 90.0
  quarantined_cross_boundary_bridge_max_step_gap_seconds: 15.0
  quarantined_cross_boundary_bridge_min_events: 4

key_materials:
  # Only collapse near-identical evidence. Repeated transfers, contacts and
  # state changes a few seconds apart remain separate physical actions.
  minimum_separation_seconds: 1.5
  duplicate_interval_overlap_ratio: 0.50
  max_per_action_type_per_atomic_experiment: 12
  max_per_experiment_group: 50
  # Keep the historical caps for short experiments, then grow a bounded
  # budget for long timelines. Selection preserves atomic experiments, action
  # types, state transitions, time buckets and object identities before using
  # confidence as a fill criterion.
  adaptive_coverage_budget_enabled: true
  adaptive_budget_step_seconds: 600.0
  adaptive_per_action_type_additional_per_step: 2
  adaptive_per_group_additional_per_step: 10
  max_per_action_type_ceiling: 48
  max_per_experiment_group_ceiling: 240
  coverage_time_bucket_seconds: 300.0
  coverage_critical_action_types:
    - container_state_change
    - device_panel_operation
    - pipette_transfer_operation
  # Strict model relabels may enter the final user-facing Key-Materials tree.
  # Rejected, uncertain and invalid multi-class replies remain in audit/cache.
  semantic_relabel_min_confidence: 0.70
  # Compatibility-safe feature switch. When disabled, the existing final-frame
  # supplement behavior is preserved exactly. Hardware profiles may enable the
  # selective policy after local A/B validation.
  selective_verification:
    enabled: false
    mode: ambiguous_or_high_risk
    minimum_closed_set_confidence: 0.45
    high_risk_actions:
      - liquid_movement
      - container_state_change
      - pipette_transfer_operation
    max_events_per_run: 120
    max_views_per_event: 2
    max_wall_seconds_per_run: 900

mllm:
  enabled: true
  # Candidate transport optimization; enable after a real-video comparison.
  # Every image, timestamp, thinking setting and response field is retained.
  compact_scene_metadata: false
  # Optional device/day video-understanding limits, independent of speech.
  # Attempts are reserved atomically. The token threshold stops NEW calls;
  # a single call may exceed it and unknown usage keeps admission blocked.
  scene_daily_attempt_limit: null
  scene_daily_token_limit: null
  base_url: https://ark.cn-beijing.volces.com/api/v3
  model: doubao-seed-2-1-pro-260628
  api_key_env: ARK_API_KEY
  timeout_seconds: 180
  max_retries: 5
  retry_max_seconds: 30
  keepalive_expiry_seconds: 60
  http2: false
  max_output_tokens: 4096
  max_images_per_event: 8
  max_images_per_event_by_action:
    liquid_movement: 12
  # Reuse the already-materialized short key clips. The model sees an aligned
  # before/peak/after sequence for each selected role instead of one still.
  use_key_clip_temporal_samples: true
  temporal_samples_per_view: 3
  # Liquid review reserves explicit slots for both roles. Profile overrides may
  # increase both counts, but configuration validation rejects silent truncation.
  liquid_primary_samples: 9
  liquid_context_samples: 3
  # Build a bounded semantic audit queue for ontology-limited CV actions. The
  # plan is written before any model call and cannot mutate CV acceptance.
  candidate_review_max_events: 120
  candidate_review_include_rejected: true
  candidate_review_rejected_min_confidence: 0.75
  candidate_review_stratified_queue_enabled: false
  candidate_review_time_bucket_seconds: 1800
  storyboard_pairs_per_group: 4
  storyboard_pairs_per_group_max: 12
  storyboard_seconds_per_pair: 300
  # A CV cut is provisional. Review per-wearable continuity across workstations
  # and the outer tail. Budget limits never establish an experiment's end.
  boundary_review:
    enabled: true
    maximum_gap_seconds: 120
    context_seconds: 12
    maximum_pairs: 20
    minimum_confidence: 0.85
    tail_window_seconds: 90
    maximum_tail_windows: 8
  max_images_per_group: 12
  group_workers: 4
  operation_review:
    enabled: true
  workers: 8
  response_language: zh-CN
  # Provider/API failure is event-level uncertainty. Completed semantic
  # receipts remain deliverable; incomplete events are machine-quarantined and
  # retryable instead of invalidating the entire run.
  fail_run_on_incomplete: false
  # Stop scheduling new event calls after a full wave of transport failures;
  # already-running calls finish and every skipped event remains retryable.
  failure_circuit_breaker_threshold: 4

archive:
  create_xlsx: true
  create_side_by_side_video: true
  keep_debug_candidates: true

daily_report:
  enabled: true
  template_id: VC-LAB-DAILY-REPORT-V2
  timezone: Asia/Shanghai
  generate_pdf: true
  additional_mllm_calls: false

collection_ingest:
  enabled: true
  poll_seconds: 30
  settle_seconds: 120
  max_results: 200
  persist_snapshot: true
  snapshot_path: null

developer_tools:
  # Internal model-development utility. It is deliberately absent from the
  # end-user navigation and disabled in normal product deployments.
  yolo_annotation_workspace_enabled: false

storage:
  index_csv: Y:/experiment_record_index.csv
  device_registry_path: null
  # Immutable relocation receipts may be supplied by a deployment when an
  # archived manifest still names a moved source. Resolution requires an exact
  # old-path match plus a current size and SHA-256 check of the mapped file.
  source_path_migration_receipts: []
  archive_root: Y:/VisionCortexExperimentArchive
  local_input_root: D:/VisionCortexLocal/Input
  local_runtime_root: D:/VisionCortexLocal/Runtime
  # Optional explicit badcase queue. When empty, the newest local
  # Model-Audits/*/YOLO-Annotation-Queue.json is discovered automatically.
  yolo_annotation_queue_path: null
  local_cache_root: D:/VisionCortexLocal/Cache
  local_staging_root: ./outputs
  sync_to_nas: false
  run_output_mode: local
  manifest_storage: local
  require_nas_source_paths: false
  # Compatibility policy for the legacy one-shot multipart endpoint. The new
  # resumable browser path always keeps one original in the active archive.
  web_upload_retention_mode: local_and_nas

# Browser uploads have no fixed total-size or duration cap. Admission is based
# on current archive-volume free space after subtracting active reservations.
web_upload:
  chunk_size_mib: 16
  session_ttl_hours: 168
  processing_headroom_ratio: 0.35
  safety_headroom_ratio: 0.10
  minimum_safety_headroom_gib: 10

validation:
  use_sidecar_annotations: true
  sidecar_name: video.annotation.json
  acceptance_baseline: null
  # Optional reviewed action-event labels. The JSON must declare dataset
  # applicability; labels are evaluation-only and never enter inference.
  key_event_ground_truth: null
  boundary_match_iou: 0.50
  max_start_error_seconds: 8.0
  max_end_error_seconds: 8.0
  # When dataset-scoped reviewed key-event truth is configured, precision and
  # recall become formal quality gates. Datasets without such truth remain
  # explicitly not evaluated rather than failing structurally.
  key_event_recall_iou: 0.50
  minimum_key_event_precision: 0.80
  minimum_key_event_recall: 0.80
  # Physical action support may be visually clear in only one view. Formal
  # delivery still requires synchronized first/third media for every event.
  minimum_cross_view_event_rate: 0.0
  # User-facing key frames must render only the objects participating in the
  # accepted event. Missing receipts fail production quality acceptance.
  require_participant_only_annotations: true
  fail_before_model_on_boundary_regression: true
