extends: ./rtx4060-laptop-production.yaml

# Dedicated profile for the actual Ubuntu workstation:
# i7-13700KF, 32 GiB RAM, GeForce RTX 3090 Ti 24 GiB.
project:
  # nas_direct replaces this with the run-specific NAS staging directory. Keep
  # the fallback on the same NAS staging filesystem as the formal archive.
  output_root: /home/x1/桌面/nas/VisionCortexExperimentArchive/.VisionCortex-Run-Staging

# Continuously discover every recorder-native camera directory on the NAS. The
# scanner reads bounded sidecar metadata only; it neither copies nor renames
# source media. A directory can be visible before its view role is approved;
# such recordings remain fail-closed instead of being guessed from its name.
speech_recognition:
  enabled: true
  python_executable: /srv/sentinel-data/VisionCortex3090Ti/Runtime/ASR-Pilot/.venv/bin/python
  model_directory: /srv/sentinel-data/VisionCortex3090Ti/Models/Speech/faster-whisper-small/536b0662742c02347bc0e980a01041f333bce120

collection_ingest:
  enabled: true
  mode: directory_metadata
  source_root: /home/x1/桌面/nas
  camera_directories: []
  camera_directory_glob: "*_cam*"
  camera_role_map:
    lubancat-4df661d7_cam01: first_person
    lubancat-e8cc0cb3_cam01: first_person
    orangepi5pro-ab748372_cam01: third_person
    orangepi5pro-b439137c_cam02: third_person
    orangepi5pro-d12a4719_cam01: first_person
    orangepi5pro-f022c4_cam01: third_person
    rk3588-ubuntu_cam01: third_person
  discover_plain_video_csv: false
  poll_seconds: 30
  settle_seconds: 120
  max_scan_directories: 20000
  max_recordings: 5000
  max_recordings_per_camera: 32
  persist_snapshot: true

alignment:
  # Formal 3090 Ti evidence may use the local timeline as a recall fallback,
  # but it needs absolute-clock or reliable visual support before promotion.
  allow_local_timeline_formal_evidence: false
  allow_uncertain_segment_formal_evidence: false

