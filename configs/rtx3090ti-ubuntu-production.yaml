    - recording_matrix_
  # Classification probes only. Accepted production jobs always retain the
  # full indexed timeline and cannot use this receipt as completion evidence.
  content_probe_max_seconds: 300
  content_probe_max_views: 2
  content_probe_receipt_dir: null
