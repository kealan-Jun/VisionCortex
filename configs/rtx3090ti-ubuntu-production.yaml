  # SAM2.1 runs only after Ark has adjudicated an event and the final
  # participant-only boxes have been selected. It propagates those boxes over
  # a bounded sample of the already-derived key clip, never over the original
  # multi-hour recording. The mask receipt can tighten a final display box and
  # audit temporal continuity, but it cannot confirm an action or liquid state.
  temporal_participant_segmentation:
    enabled: true
    required_for_final_key_material: true
    backend: SAM2VideoPredictor
    model: sam2.1_hiera_base_plus
    model_config: configs/sam2.1/sam2.1_hiera_b+.yaml
    checkpoint_path: /srv/sentinel-data/VisionCortex3090Ti/Engines/sam2.1_hiera_base_plus.pt
    checkpoint_sha256: a2345aede8715ab1d5d31b4a509fb160c5a4af1970f199d9054ccfb746c004c5
    checkpoint_download_url: https://dl.fbaipublicfiles.com/segment_anything_2/092824/sam2.1_hiera_base_plus.pt
    source_revision: 2b90b9f5ceec907a1c18123530e92e794ad901a4
    device: cuda
    # Full torch.compile has a large first-run cost and is counterproductive
    # for nine-frame evidence windows. Keep eager BF16 propagation cached.
    vos_optimized: false
    # The optional SAM2 CUDA connected-components extension is deliberately not
    # built because the host nvcc and PyTorch CUDA minor versions differ.
    apply_postprocessing: false
    offload_video_to_cpu: true
    offload_state_to_cpu: false
    maximum_frames_per_clip: 9
    jpeg_quality: 95
    minimum_presence_ratio: 0.34
    minimum_presence_ratio_by_action:
      liquid_movement: 0.55
      container_state_change: 0.45
      pipette_transfer_operation: 0.45
      object_movement: 0.34
      hand_object_contact: 0.34
      device_panel_operation: 0.34
    minimum_seed_box_iou: 0.35
    maximum_seed_area_expansion_ratio: 1.35
    enabled_actions:
      - hand_object_contact
      - object_movement
      - liquid_movement
      - container_state_change
      - device_panel_operation
      - pipette_transfer_operation

  # Published LabPics PSPNet semantic sidecar. It complements object boxes
  # with vessel/fill/liquid/solid pixel observations on final key frames only.
  # These masks are auditable observations; they can never confirm an action.
  liquid_semantic_sidecar:
    enabled: true
    required_for_selected_actions: true
    backend: LabPics-PSPNet-ResNet101
    checkpoint_path: /srv/sentinel-data/VisionCortex3090Ti/Engines/labpics-semantic-materials.torch
    checkpoint_sha256: 767bf7838ab89c4134628f189649c092a3af6dea00bfd19c69b93ab0c307a83f
    source_archive_path: /srv/sentinel-data/VisionCortex3090Ti/Runtime/PublicModels/LabPicsSemantic/LabPicsSemantic.zip
    source_archive_url: https://zenodo.org/api/records/3697767/files/Semantic_Segmentation_Materials_In_VesselLabPics_PreTrained_WITH_WEIGHT.zip/content
    source_archive_sha256: 1e9f3b66e8ef1e03b7549d7035afc41093c4755d3369e7fbc70cf0be6e1d9007
    source_archive_member: logs/TrainedModelWeiht1m_steps_Semantic_TrainedWithLabPicsAndCOCO_AllSets.torch
    source_record: https://zenodo.org/records/3697767
    license: CC-BY-4.0
    device: cuda
    half: true
    maximum_image_size: 640
    mask_threshold: 0.50
    enabled_actions:
      - liquid_movement
      - container_state_change
      - pipette_transfer_operation

key_materials:
  # The closed-set TensorRT ledger remains authoritative for every accepted
  # event. Expensive local grounding is admitted only for high-risk actions or
  # incomplete/ambiguous final participant evidence, with deterministic caps.
  selective_verification:
    enabled: true
    mode: ambiguous_or_high_risk
    minimum_closed_set_confidence: 0.45
    high_risk_actions:
      - liquid_movement
      - container_state_change
      - pipette_transfer_operation
    max_events_per_run: 120
    max_views_per_event: 2
    max_wall_seconds_per_run: 900

performance:
  profile: rtx3090ti-24gb-ubuntu-dynamic-multiview
  tensor_rt: required
  # Keep discovery proportional to experiment time instead of camera count.
  # The wearable boundary view establishes a deterministic 0.1 FPS timeline;
  # its YOLO ledger is reused by coarse discovery, and independent static
  # views enter only bounded 20 FPS waves for unresolved aligned anchors.
  motion_probe_fps: 0.1
  motion_probe_max_width: 416
  motion_probe_keyframes_only: true
  motion_probe_sparse_strategy: auto
  motion_probe_run_yolo: true
  coarse_reuse_motion_probe: true
  motion_probe_all_views: false
  motion_probe_first_person_views: 1
  motion_probe_third_person_views: 0
  motion_probe_camera_motion_compensation: true
  motion_probe_affine_compensation_enabled: true
  motion_probe_max_rotation_degrees: 8.0
  motion_probe_max_scale_delta: 0.12
  motion_probe_rolling_threshold_enabled: true
  motion_probe_rolling_window_seconds: 600.0
  motion_probe_legacy_raw_union_enabled: true
  motion_probe_max_cluster_seconds: 300.0
  motion_probe_camera_motion_min_response: 0.15
  motion_probe_camera_motion_max_shift_ratio: 0.35
  motion_probe_first_person_quality_fallback: true
  motion_probe_first_person_raw_motion_weight: 0.25
  # Retain the stronger 2 FPS detector setting for bounded fallback scans, but
  # do not execute it across every camera and every idle hour. The reusable
  # 0.1 FPS first-person ledger is the coarse boundary source in the normal
  # path; unsupported windows remain recall guards for progressive fine scan.
  coarse_detection_fps: 2.0
  coarse_image_size: 416
  coarse_keyframes_only: false
  coarse_all_views: true
  coarse_full_timeline_scan: false
  coarse_shared_motion_probe_enabled: false
  coarse_frame_index_enabled: false
  coarse_coverage_gate_enabled: false
  coarse_minimum_coverage_ratio: 0.98
  coarse_maximum_gap_periods: 4.0
  candidate_discovery_quality_gate_enabled: true
  coarse_semantic_association_enabled: true
  coarse_semantic_cluster_margin_seconds: 3.0
  coarse_max_boundary_expansion_seconds: 15.0
  coarse_spatial_relation_enabled: true
  coarse_hand_object_gap_norm: 0.08
  coarse_hand_object_approach_gap_norm: 0.16
  coarse_hand_object_approach_delta_norm: 0.025
  coarse_micro_action_guard_enabled: true
  coarse_micro_action_min_confidence: 0.72
  coarse_micro_action_window_seconds: 4.0
  coarse_rolling_motion_threshold_enabled: true
  coarse_rolling_motion_window_seconds: 600.0
  coarse_tracker_motion_prediction_enabled: true
  coarse_tracker_maximum_center_distance: 0.18
  coarse_comprehensive_candidate_union: true
  coarse_open_vocabulary_recall_enabled: true
  coarse_open_vocabulary_motion_percentile: 90.0
  coarse_open_vocabulary_frames_per_hour_per_view: 2
  coarse_open_vocabulary_adaptive_selection_enabled: true
  coarse_open_vocabulary_diversity_bucket_seconds: 600.0
  coarse_open_vocabulary_max_frames_per_hour_per_view: 8
  coarse_open_vocabulary_maximum_error_rate: 0.10
  coarse_open_vocabulary_candidate_window_seconds: 4.0
  coarse_open_vocabulary_max_actor_object_gap_norm: 0.08
  # Fine scanning starts from the first-person boundary evidence at 20 FPS.
  # Third-person views are admitted only for unresolved aligned anchors. This
  # preserves the dense temporal grid and complete candidate/audit receipts
  # while avoiding a broad full-timeline pass on any static camera.
  detection_fps: 20.0
  fine_initial_third_person_views: 0
  # Preserve the same all-view 20 FPS envelope while eliminating repeated
  # ledger parsing and admitting formal evidence from actual sampled coverage.
  fine_frame_index_enabled: true
  fine_coverage_gate_enabled: true
  fine_minimum_coverage_ratio: 0.98
  fine_maximum_gap_periods: 4.0
  fine_streaming_candidates_enabled: true
  fine_state_max_entries: 4096
  fine_instance_association_enabled: true
  fine_instance_appearance_enabled: true
  fine_instance_minimum_cosine_similarity: 0.25
  fine_instance_cross_view_conflict_quarantine_enabled: true
  fine_track_stitching_enabled: true
  fine_track_stitch_max_gap_seconds: 2.5
  fine_track_stitch_max_center_distance: 0.12
  fine_contact_state_enabled: true
  fine_affine_object_motion_enabled: true
  fine_roi_open_vocabulary_recall_enabled: true
  fine_roi_open_vocabulary_max_frames_per_window: 2
  fine_roi_open_vocabulary_hand_padding_norm: 0.20
  fine_roi_open_vocabulary_maximum_error_rate: 0.10
  fine_tracker_motion_prediction_enabled: true
  fine_tracker_maximum_center_distance: 0.18
  audit_constrained_clustering_enabled: true
  audit_local_alignment_enabled: true
  audit_explainable_scoring_enabled: true
  audit_formal_admission_status_enabled: true
  audit_core_interval_enabled: true
  audit_stable_event_ids_enabled: true
  audit_sqlite_candidate_index_enabled: true
  audit_max_cluster_span_seconds: 30.0
  audit_core_start_quantile: 0.50
  audit_core_end_quantile: 0.50
  audit_independent_view_bonus: 0.04
  audit_dual_role_bonus: 0.04
  audit_maximum_independence_bonus: 0.12
  audit_maximum_alignment_penalty: 0.08
  audit_liquid_spatial_context_enabled: true
  audit_liquid_context_hand_object_gap_norm: 0.08
  audit_liquid_context_minimum_frames: 2
  audit_liquid_sequence_formal_gate_enabled: true
  action_state_observed_timestamps_enabled: true
  fine_risk_window_expansion_enabled: true
  fine_risk_extra_padding_seconds: 30.0
  fine_risk_low_confidence_threshold: 0.70
  fine_risk_conflict_gap_seconds: 15.0
  fine_risk_action_types:
    - liquid_movement
    - container_state_change
    - device_panel_operation
  fine_low_alignment_extra_padding_enabled: true
  fine_low_alignment_confidence_threshold: 0.80
  fine_low_alignment_extra_padding_seconds: 30.0
  # Short recordings can contain one decisive action anywhere in the clip.
  # Their entire indexed timeline is cheap enough to scan at the configured
  # fine rate on every eligible view. Multi-hour sources retain the same
  # strengthened motion/coarse/fine funnel and are certified separately on
  # held-out action windows.
  auto_exhaustive_short_timeline_enabled: true
  auto_exhaustive_short_timeline_seconds: 600
  # Retain the existing batch-4 engines. A 2026-09-08 bounded 640px profile
  # successfully built batch 32, so four is not the GPU's memory ceiling.
  # That candidate changed several detection receipts and is not promoted.
  # Runtime requests are split according to the loaded engine's real capacity.
  engine_batch_size: 4
  batch_size: 16
  coarse_batch_size: 16
  motion_probe_batch_size: 16
  fine_batch_size: 16
  fine_active_decode_slots: 8
  # Four real-source cold runs on 2026-09-08 preserved all 2014 candidates,
  # 979 movement receipts, five boundaries and 61 selected event identities.
  # The single-role supplemental wave can now use independent contexts;
  # they share the eight decode slots instead of multiplying that budget.
  fine_inference_workers_per_role: 3
  fine_first_person_decode_workers: 4
  fine_third_person_decode_workers: 6
  fine_decode_prefetch_frames: 48
  # The 2026-08-24 six-view cold A/B showed that splitting at 30 seconds
  # increased exact decode sessions from 59 to 78 and candidate_fine wall time
  # from 731.499 s to 872.931 s. Keep one persistent physical-segment session;
  # the configurable split remains available for other storage topologies.
  fine_persistent_session_max_gap_seconds: null
  fine_supplemental_view_batch_size: 3
  motion_probe_indexed_segment_workers: 4
  motion_probe_sequential_segment_workers: 6
  # One CUDA lane expands to the live view count. Camera count remains driven
  # by the NAS index rather than by this hardware profile.
  coarse_decode_lanes: [cuda]
  fine_decode_lanes: [cuda]
  # CUDA decode remains enabled, but GPU resize is deliberately disabled.
  # Two cold A0004 audits (nearest and bicubic) reduced wall time yet shifted
  # the reviewed start boundary by +13.6 s, beyond the 8 s quality contract.
  # CPU scale reproduces the accepted detector input distribution and avoids
  # the previously attempted incompatible scale_cuda syntax/fallback cycle.
  ffmpeg_cuda_scale: false
  source_workers: 12
  decode_queue_depth: 64
  cpu_decode_threads: 12
  # The scheduler consumes this value as real per-role scanner capacity. The
  # cold four-view A/B on this host showed that pooling three sparse coarse
  # streams into one context increased motion/coarse wall time by 26 seconds;
  # retain parallel contexts and use progressive windows to remove work.
  yolo_inference_workers: 3
  materialization_workers: 3
  # Keep one bounded decoder cache per physical view during key-material
  # generation. The same verified experiment clip is otherwise reopened for
  # every event even though event processing is ordered by the archive.
  key_material_frame_reader_max_open: 2
  # An alternating four-group A/B with byte-identical outputs measured
  # sequential at 82.85/87.08 s and overlap at 87.35/84.75 s. The overlapping
  # mean was 1.27% slower because aligned NVENC work contended with the two role
  # clips. Keep this optional scheduler disabled on this host; key-material
  # aligned clips retain their independently proven overlap below.
  overlap_aligned_experiment_clips: false
  aligned_experiment_clip_workers: 2
  # Role clips for event N+1 can encode while the aligned clip for event N is
  # assembled. Media paths and event objects are disjoint, and publication is
  # still delayed until every future has completed successfully.
  overlap_aligned_key_materials: true
  aligned_key_material_workers: 2
  # Exact derived MP4s are immutable and content-addressed beneath the existing
  # NAS cache root. Cold audits populate the cache without reading it; their
  # explicitly paired reuse runs verify hashes before materialization.
  derived_media_cache_enabled: true

  io_workers: 6
  max_gpu_memory_fraction: 0.90
  concurrent_role_scanners: true
  preflight_probe_workers: 16
  source_stat_workers: 32
  synchronized_segment_waves: false
  fine_min_third_person_views: null

archive:
  # Empty action categories remain represented in the central JSON coverage
  # index, but do not appear as misleading media folders containing JSON only.
  include_empty_action_categories: false

mllm:
  candidate_review_stratified_queue_enabled: true
  candidate_review_time_bucket_seconds: 1800
  # Keep the evidence originals untouched while bounding only the request
  # representation. On the real workstation the unbounded first failure wave
  # spent more than twenty minutes repeatedly uploading review images through
  # the LAN proxy. Two bounded attempts and a two-request failure wave keep a
  # provider outage resumable without stalling local evidence production.
  request_image_max_edge: 768
  request_image_jpeg_quality: 82
  timeout_seconds: 180
  max_retries: 2
  failure_circuit_breaker_threshold: 2
  # Common actions retain both views in three aligned temporal phases while
  # halving image count. Liquid/container/panel evidence keeps the inherited
  # six high-detail per-view samples because small state changes limit quality.
  compact_aligned_temporal_actions:
    - hand_object_contact
    - object_movement
  # Liquid is the only class where sparse review can miss a complete source,
  # transport, target and plunger sequence. Densely sample the primary view and
  # retain three context frames from the paired view; all frames come from the
  # already materialized event clip and never rescan or copy source video.
  temporal_samples_per_view_by_action:
    liquid_movement: 15
  liquid_primary_samples: 15
  liquid_context_samples: 3
  max_images_per_event_by_action:
    liquid_movement: 18

segmentation:
  # The paired local preprocessing comparison measured 218.27 -> 196.61 s
  # with the same engines and evidence. Two movement workers were faster
  # than four in the isolated replay; keep decoding's default thread policy.
  movement_visual_verification:
    workers: 2
    frame_cache_size: 512
  # The exhaustive short-timeline path sees accepted preparation evidence
  # outside sparse motion-sentinel windows.  A publication-primary single-role
  # chain may extend the boundary only when it reaches the first dual-role
  # opener through <=10 s steps; semantic-provisional and component-only events
  # remain non-bounding.
  accepted_leading_context_enabled: true
  accepted_leading_context_max_gap_seconds: 10.0
  accepted_leading_context_max_extension_seconds: 90.0
  # A same-time opposite-role activity hint is recall evidence, not enough to
  # create a formal experiment.  Small state/liquid/panel hypotheses require a
  # separately completed cross-view movement anchor before Ark review.
  semantic_review_requires_dual_role_movement_anchor: true
  # This is only the CV-to-semantic-review recall gate.  A liquid event still
  # requires the independent fail-closed Ark action-proof contract before it
  # can enter key materials or satisfy production quality.  The 0.60 gate adds
  # only four single-role candidates on the full 3.3 h ledger;
  # one is the observed 0.6125 repeated pipette-transfer interval.  All four
  # still require the unchanged independent Ark proof contract.
  single_view_action_accept_confidence:
    liquid_movement: 0.60

continuity:
  # Stationary bottles/racks can keep a tracker ID for minutes.  Stable identity
  # is a direct continuity proof only across a short gap; longer reviewed chains
  # must pass the existing dense cross-gap context rule instead.
  stable_identity_max_gap_seconds: 10.0

resource_limits:
  gpu_memory_normal_fraction: 0.75
  gpu_memory_warning_fraction: 0.85
  gpu_memory_contract_fraction: 0.90
  system_memory_normal_fraction: 0.68
  system_memory_warning_fraction: 0.80
  system_memory_contract_fraction: 0.88
  gpu_temperature_warning_c: 82

storage:
  index_csv: /home/x1/桌面/nas/experiment_record_index.csv
  archive_root: /home/x1/桌面/nas/VisionCortexExperimentArchive
  # This contains only small generated manifests/bookkeeping. Original videos
  # remain on the NAS and are read as a segmented virtual timeline.
  local_input_root: /srv/sentinel-data/VisionCortex3090Ti/Runtime/Input-Manifests
  local_runtime_root: /srv/sentinel-data/VisionCortex3090Ti/Runtime
  # The inherited field name is kept for compatibility. Reuse the existing NAS
  # cache root; do not create a second RTX-specific cache hierarchy.
  local_cache_root: /home/x1/桌面/nas/VisionCortexExperimentCache
  local_staging_root: /home/x1/桌面/nas/VisionCortexExperimentArchive/.VisionCortex-Run-Staging
  # Browser originals are written once to the NAS archive and analyzed there.
  web_upload_retention_mode: nas_only

validation:
  acceptance_baseline:
    exp_20260717_114053_2f08f953: ./configs/acceptance/customflow-a-0002-codex-visual-baseline.json
    exp_20260810_144014_e918b762: ./configs/acceptance/six-view-three-hour-reviewed-baseline.json
    exp_20260811_161842_ca175e55: ./configs/acceptance/customflow-a-0004-codex-visual-baseline.json
    exp_20260812_133147_53d6cbd4: ./configs/acceptance/customflow-z-0001-codex-visual-baseline.json
  key_event_ground_truth:
    exp_20260717_114053_2f08f953: ./configs/evaluation/customflow-a-0002-codex-visual-key-events.json
    exp_20260811_161842_ca175e55: ./configs/evaluation/customflow-a-0004-codex-visual-key-events.json
    exp_20260812_133147_53d6cbd4: ./configs/evaluation/customflow-z-0001-codex-visual-key-events.json
  model_certification:
    # Runtime evidence generation must not wait for a separate human-issued
    # certificate. Each run remains fail-closed at the claim level through its
    # own evidence/quality receipts; release promotion still applies the
    # repository's independent real-video quality gate.
    required_for_formal_production: false
    path: /srv/sentinel-data/VisionCortex3090Ti/Runtime/Model-Quality/production_model_certification.json
    box_evaluation_reports: []
    targets:
      event_temporal_iou: 0.50
      minimum_event_dataset_count: 5
      minimum_event_ground_truth_count: 200
      minimum_event_precision: 0.92
      minimum_event_recall: 0.95
      minimum_event_precision_ci_lower: 0.88
      minimum_event_recall_ci_lower: 0.90
      minimum_ground_truth_per_action: 20
      minimum_per_action_precision: 0.90
      minimum_per_action_recall: 0.90
      minimum_box_dataset_count: 3
      minimum_box_ground_truth_instances: 500
      minimum_box_precision: 0.92
      minimum_box_recall: 0.95
      required_action_types:
        - hand_object_contact
        - object_movement
        - liquid_movement
        - container_state_change
        - device_panel_operation
        - pipette_transfer_operation

collection_curation:
  real_experiment_prefixes:
    - CapToggle_
    - CustomFlow_
    - DissolveStir_
    - FullProcess_
    - Pipetting_
    - TubeCleanDry_
    - TubePlaceDilute_
