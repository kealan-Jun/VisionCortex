# Explicit hardware/analysis parameters only; no site paths or device identities.
# Selecting this profile does not supply weights or configure a production deployment.
extends: ./rtx3090ti-ubuntu-base.yaml
models:
  first_person: ./models/ClosedSetYOLO/first_person/best.pt
  third_person: ./models/ClosedSetYOLO/third_person/best.pt
  first_person_engine: ./Runtime/Engines/first_person.engine
  third_person_engine: ./Runtime/Engines/third_person.engine
  open_vocabulary_key_frame:
    model_path: ./models/Public/yolov8s-worldv2.pt
    clip_model_path: ./models/Public/ViT-B-32.pt
    device: 0
    image_size: 960
    minimum_manipulated_object_confidence:
      reagent_bottle: 0.12
    grounding_dino_fallback:
      model_path: ./models/Public/grounding-dino-base
      device: cpu
      temporal_rescue_device: cuda
  temporal_participant_segmentation:
    checkpoint_path: ./models/Public/sam2.1_hiera_base_plus.pt
    device: cuda
    offload_video_to_cpu: true
    offload_state_to_cpu: true
    maximum_frames_per_clip: 9
  liquid_semantic_sidecar:
    checkpoint_path: ./models/Public/labpics-semantic-materials.torch
    source_archive_path: ./models/Public/LabPicsSemantic.zip
    device: cpu
    half: false
    maximum_image_size: 640
performance:
  profile: rtx3050-6gb-ubuntu20-full-chain
  tensor_rt: required
  engine_dynamic: false
  engine_batch_candidates:
  - 16
  - 8
  - 4
  - 2
  - 1
  engine_batch_size: 16
  engine_workspace_gib: 1.0
  engine_autotune_iterations: 6
  engine_autotune_max_gpu_memory_fraction: 0.78
  batch_size: 16
  coarse_batch_size: 16
  motion_probe_batch_size: 16
  fine_batch_size: 16
  coarse_image_size: 640
  fine_scout_image_size: 640
  motion_probe_max_width: 640
  image_size: 640
  fine_active_decode_slots: 4
  fine_first_person_decode_workers: 2
  fine_third_person_decode_workers: 3
  fine_decode_prefetch_frames: 8
  fine_supplemental_view_batch_size: 2
  motion_probe_indexed_segment_workers: 2
  motion_probe_sequential_segment_workers: 3
  coarse_decode_lanes:
  - cuda
  - cuda
  - cuda
  - cuda
  - cpu
  - cpu
  fine_decode_lanes:
  - cuda
  - cuda
  - cuda
  - cuda
  - cpu
  - cpu
  source_workers: 6
  decode_queue_depth: 32
  cpu_decode_threads: 4
  yolo_inference_workers: 1
  inference_batch_wait_ms: 35
  materialization_workers: 1
  io_workers: 2
  max_gpu_memory_fraction: 0.86
  concurrent_role_scanners: false
  release_auxiliary_models_after_event: true
  preflight_probe_workers: 6
  source_stat_workers: 12
mllm:
  group_workers: 2
  workers: 2
key_materials:
  selective_verification:
    max_wall_seconds_per_run: 1800
  participant_visual_review:
    enabled: true
    classes:
    - paper
    - bottle_cap
    - balance
    max_calls_per_run: 64
    max_candidates_per_view: 20
    max_output_tokens: 1800
    timeout_seconds: 60
    temporal_keyframe_review:
      enabled: true
      max_frames_per_event: 5
resource_limits:
  gpu_memory_normal_fraction: 0.68
  gpu_memory_warning_fraction: 0.78
  gpu_memory_contract_fraction: 0.88
  system_memory_normal_fraction: 0.65
  system_memory_warning_fraction: 0.75
  system_memory_contract_fraction: 0.86
  gpu_temperature_warning_c: 78
validation:
  model_certification:
    path: ./Runtime/Model-Quality/production_model_certification.json
project:
  run_purpose: analysis
