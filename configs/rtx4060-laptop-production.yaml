project:
  output_root: D:/VisionCortexLocal/Runtime/outputs

models:
  first_person: ./models/first_person/best.pt
  third_person: ./models/third_person/best.pt
  first_person_engine: ./models/first_person/best.engine
  third_person_engine: ./models/third_person/best.engine

performance:
  profile: rtx4060-laptop-8gb-six-view
  preprocessing_budget_seconds: 1200
  device: 0
  half: true
  tensor_rt: required
  coarse_detection_fps: 1.5
  coarse_image_size: 416
  coarse_batch_size: 32
  coarse_keyframes_only: false
  # One indexed frame every four seconds is enough to find multi-second lab
  # activity; 90-second padding and bounded all-view scans protect recall.
  motion_probe_fps: 0.25
  motion_probe_max_width: 96
  motion_probe_keyframes_only: true
  motion_probe_first_person_views: 1
  # The validated wearable stream is only 8.22 GiB. It discovers windows;
  # every first/third-person view still joins the bounded YOLO scans.
  motion_probe_third_person_views: 0
  motion_probe_percentile: 85.0
  motion_probe_burst_merge_gap_seconds: 20.0
  motion_probe_min_observations: 2
  motion_probe_merge_gap_seconds: 20.0
  motion_probe_min_views: 1
  motion_probe_primary_min_seconds: 45.0
  motion_probe_window_padding_seconds: 90.0
  motion_probe_fallback_peaks_per_hour: 8
  motion_probe_fallback_separation_seconds: 120.0
  motion_probe_fallback_window_seconds: 60.0
  # Indexed seek is latency-bound; three segment readers overlap SMB latency
  # without asking TensorRT or NVDEC to load extra model contexts.
  motion_probe_segment_workers: 3
  motion_signature_size: [64, 36]
  detection_fps: 10.0
  image_size: 640
  fine_batch_size: 16
  synchronized_segment_waves: true
  segment_wave_timeout_seconds: 3600
  coarse_decode_lanes: [cuda, cuda, cuda, cuda, cpu, cpu]
  fine_decode_lanes: [cuda, cuda, cuda, cuda, cpu, cpu]
  source_workers: 6
  # Two full TensorRT batches can be decoded ahead while the GPU executes the
  # current batch. At 416/640 width this remains a small RAM allocation.
  decode_queue_depth: 32
  cpu_decode_threads: 8
  yolo_inference_workers: 2
  inference_batch_wait_ms: 25
  materialization_workers: 2
  io_workers: 4
  max_gpu_memory_fraction: 0.88
  ffmpeg_hwaccel: cuda
  ffmpeg_video_encoder: h264_nvenc
  concurrent_role_scanners: true
  preflight_probe_workers: 12
  # All five fixed third-person views join bounded fine windows. This both
  # fills the shared third-person TRT batches and guarantees cross-view audit.
  fine_min_third_person_views: 5

alignment:
  max_csv_points_per_view: 30000

mllm:
  model: doubao-seed-2-1-pro-260628
  # Group and key-material understanding are network/API-bound and run after
  # GPU preprocessing, so they can use a wider bounded pool without consuming
  # additional TensorRT contexts.
  group_workers: 5
  workers: 8
  max_retries: 5
  retry_max_seconds: 30

resource_limits:
  gpu_memory_normal_fraction: 0.70
  gpu_memory_warning_fraction: 0.80
  gpu_memory_contract_fraction: 0.88
  system_memory_normal_fraction: 0.70
  system_memory_warning_fraction: 0.80
  system_memory_contract_fraction: 0.90
  cpu_warning_percent: 85
  gpu_temperature_warning_c: 80
  telemetry_interval_seconds: 1.0

storage:
  index_csv: Y:/experiment_record_index.csv
  archive_root: Y:/VisionCortexExperimentArchive
  # The NAS recorder's 15-minute segments are the original input. They are
  # indexed as a virtual timeline and are never copied into one 82-88 GB file.
  local_input_root: D:/VisionCortexLocal/Input
  local_runtime_root: D:/VisionCortexLocal/Runtime
  local_cache_root: D:/VisionCortexLocal/Cache
  local_staging_root: D:/VisionCortexLocal/Runtime/outputs
  sync_to_nas: true
  run_output_mode: nas_direct
  manifest_storage: nas
  require_nas_source_paths: true

validation:
  acceptance_baseline: ./configs/acceptance/six-view-three-hour-reviewed-baseline.json
