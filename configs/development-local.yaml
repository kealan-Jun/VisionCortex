# Local development/acceptance profile. It intentionally never reads or writes NAS.
project:
  output_root: ./outputs/development-runs

mllm:
  enabled: false

storage:
  index_csv: ./examples/development-index.csv
  archive_root: ./outputs/clean-local-validation
  local_input_root: ./outputs/development-input
  local_runtime_root: ./outputs/development-runtime
  local_cache_root: ./outputs/development-cache
  local_staging_root: ./outputs/development-runs
  sync_to_nas: false
