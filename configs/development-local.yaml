# First-clone UI and synthetic-contract profile; all working roots stay local.
project:
  run_purpose: demo
  output_root: ./outputs/development-runtime/runs
runtime:
  local_only: true
mllm:
  enabled: false
storage:
  index_csv: ./examples/development-index.csv
  device_registry_path: null
  archive_root: ./outputs/development-runtime/archives
  local_input_root: ./outputs/development-runtime/input
  local_runtime_root: ./outputs/development-runtime
  local_cache_root: ./outputs/development-runtime/cache
  local_staging_root: ./outputs/development-runtime/runs
  sync_to_nas: false
  run_output_mode: local
  manifest_storage: local
  require_nas_source_paths: false
  web_upload_retention_mode: local_only
collection_ingest:
  enabled: false
  snapshot_path: ./outputs/development-runtime/cache/Collection-Catalog/experiment_record_index.snapshot.json
device_day:
  enabled: false
