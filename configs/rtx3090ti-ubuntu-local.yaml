# Relocatable local analysis profile. Install and verify model dependencies explicitly.
extends: ./rtx3090ti-ubuntu-base.yaml
project:
  run_purpose: analysis
  output_root: ./outputs/rtx3090ti-ubuntu-runtime/runs
runtime:
  local_only: true
mllm:
  enabled: false
storage:
  index_csv: ./examples/development-index.csv
  device_registry_path: null
  archive_root: ./outputs/rtx3090ti-ubuntu-runtime/archives
  local_input_root: ./outputs/rtx3090ti-ubuntu-runtime/input
  local_runtime_root: ./outputs/rtx3090ti-ubuntu-runtime
  local_cache_root: ./outputs/rtx3090ti-ubuntu-runtime/cache
  local_staging_root: ./outputs/rtx3090ti-ubuntu-runtime/runs
  sync_to_nas: false
  run_output_mode: local
  manifest_storage: local
  require_nas_source_paths: false
  web_upload_retention_mode: local_only
collection_ingest:
  enabled: false
  snapshot_path: ./outputs/rtx3090ti-ubuntu-runtime/cache/Collection-Catalog/experiment_record_index.snapshot.json
  source_root: ./outputs/rtx3090ti-ubuntu-runtime/input
  additional_camera_directories: []
  directory_camera_bindings: []
device_day:
  enabled: false
  delete_capture_sources: false
speech_recognition:
  enabled: false
  python_executable: null
  model_directory: null
validation:
  require_model_certification: false
